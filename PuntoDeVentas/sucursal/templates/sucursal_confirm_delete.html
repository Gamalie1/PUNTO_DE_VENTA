{% extends "base.html" %} 
{% block title %}Eliminar Sucursal{% endblock %} 
{% block content %}
<div class="container">
  <h2>¿Seguro que quieres eliminar la sucursal "{{ object.nombre }}"?</h2>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'sucursal_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
