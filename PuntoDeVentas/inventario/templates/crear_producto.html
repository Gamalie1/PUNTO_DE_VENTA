{% extends "base.html" %}
{% block title %}Registrar Producto{% endblock %}

{% block content %}


<section class="content">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-primary shadow-lg">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title"><i class="fas fa-box-open mr-2"></i> Registrar Nuevo Producto</h3>
                    </div>
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="card-body">
                            {% if form.errors %}
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                <strong>Error!</strong> {{ form.errors }}
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            {% endif %}
                            
                            <!-- Nombre del producto -->
                            <div class="mb-3">
                                <label for="{{ form.nombre.id_for_label }}" class="form-label">Nombre del producto:</label>
                                <input type="text" name="nombre" class="form-control" placeholder="Nombre del producto" value="{{ form.nombre.value|default:'' }}" required>
                            </div>

                            <!-- Descripción -->
                            <div class="mb-3">
                                <label for="{{ form.descripcion.id_for_label }}" class="form-label">Descripción:</label>
                                <textarea name="descripcion" class="form-control" rows="3" placeholder="Descripción..." required>{{ form.descripcion.value|default:'' }}</textarea>
                            </div>

                            <!-- Precio -->
                            <div class="mb-3">
                                <label for="{{ form.precio.id_for_label }}" class="form-label">Precio:</label>
                                <input type="number" name="precio" class="form-control" step="0.01" placeholder="Precio" value="{{ form.precio.value|default:'' }}" required>
                            </div>

                        
                            <div class="mb-3">
    <label for="{{ form.stock.id_for_label }}" class="form-label">Stock:</label>
    <input type="number" name="stock" class="form-control" placeholder="Stock" value="{{ form.stock.value|default:'' }}" required>
</div>

                            <!-- Imagen -->
                            <div class="mb-3">
                                <label for="{{ form.imagen.id_for_label }}" class="form-label">Imagen:</label>
                                <input type="file" name="imagen" class="form-control" required>
                            </div>

                            <!-- Producto único (campo desplegable) -->
                           
<div class="mb-3">
    <label for="es_unico" class="form-label">¿Producto único?</label>
    <select name="es_unico" class="form-control">
        <option value="True" {% if form.es_unico.value == True %}selected{% endif %}>Sí</option>
        <option value="False" {% if form.es_unico.value == False %}selected{% endif %}>No</option>
    </select>
</div>

                        </div>
                        
<div class="card-footer d-flex justify-content-between">
    <!-- Botón de guardar -->
    <button type="submit" class="btn btn-success btn-lg btn-block rounded-pill shadow-sm">
        <i class="fas fa-save mr-1"></i> Guardar Producto
    </button>
    <!-- Botón de cancelar -->
    <a href="{% url 'lista_productos' %}" class="btn btn-secondary btn-lg btn-block rounded-pill shadow-sm">
        <i class="fas fa-times-circle mr-1"></i> Cancelar
    </a>
</div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Estilos adicionales para personalizar el formulario -->
<style>
    .card-header {
        background-color: #007bff; /* Color de fondo para el encabezado */
        color: white;
        border-radius: 10px 10px 0 0;
    }

    .card-body {
        background-color: #f4f6f9;
        padding: 20px;
    }

    .card-footer {
        background-color: #f4f6f9;
        padding: 20px;
        border-radius: 0 0 10px 10px;
    }

    .form-label {
        font-size: 1.1rem;
        color: #333;
    }

    .form-control {
        border-radius: 5px;
        padding: 12px;
        font-size: 1rem;
        width: 100%;
        background-color: #f9f9f9;
        border: 1px solid #ddd;
    }

    .btn {
        font-size: 1rem;
        font-weight: bold;
        padding: 10px;
    }

    .btn-success {
        background-color: #28a745;
        border-color: #28a745;
    }

    .btn-success:hover {
        background-color: #218838;
        border-color: #1e7e34;
    }

    .btn-secondary {
        background-color: #6c757d;
        border-color: #6c757d;
    }

    .btn-secondary:hover {
        background-color: #5a6268;
        border-color: #545b62;
    }

    .mb-3 {
        margin-bottom: 20px;
    }

    .form-control {
        background-color: #f9f9f9;
        border: 1px solid #ddd;
    }

    .alert {
        font-size: 1rem;
        padding: 15px;
        border-radius: 8px;
    }

    .alert-dismissible .close {
        padding: 0.5rem;
        color: #aaa;
        font-size: 1.5rem;
    }
</style>
{% endblock %}
