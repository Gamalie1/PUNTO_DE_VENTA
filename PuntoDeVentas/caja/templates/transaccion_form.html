{% extends "base.html" %} 
{% block title %}Registrar Transacción{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="card shadow">
    <div class="card-header">
      <h3 class="card-title">Registrar Transacción</h3>
    </div>
    <div class="card-body">
      <form method="POST">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit" class="btn btn-success">
          <i class="fas fa-save mr-1"></i> Registrar Transacción
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
